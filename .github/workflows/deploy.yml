# Publica o app no GitHub Pages a cada push na branch main (e manualmente pela aba Actions).
# Configuração única: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Se o Pages estiver em "Deploy from a branch", o GitHub publica também os arquivos-fonte
      # do repositório (index.html apontando para /src/main.tsx) e o site fica em branco.
      - name: Conferir se o GitHub Pages usa "GitHub Actions"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tipo=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('build_type') or '')")
          echo "Fonte do GitHub Pages: ${tipo:-desconhecida}"
          if [ "$tipo" != "workflow" ]; then
            echo "::error::O GitHub Pages não está configurado como 'GitHub Actions' (atual: ${tipo:-não ativado}). Vá em Settings → Pages → Build and deployment → Source e escolha 'GitHub Actions'. Com 'Deploy from a branch' o site mostra tela em branco."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Opcional: registro compartilhado (Settings → Secrets and variables → Actions → Variables)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
