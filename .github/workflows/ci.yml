name: Verificação

on:
  pull_request:
  push:
    branches-ignore: [main] # na main quem testa é o workflow de publicação

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
